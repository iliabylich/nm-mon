name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: release version in MAJOR.MINOR.PATCH version, no "v" prefix
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: iliabylich/validate-release-version@v1
        with:
          version: ${{ inputs.version }}

      - uses: jdx/mise-action@v5
      - run: mise run release

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "target/release/nm-mon,systemd/nm-mon.service,systemd/nm-mon.socket"
          tag: v${{ inputs.version }}
